# CI: verify pushes to main and feature/**, and pull requests to main, then
# publish a tested linux/amd64 image to GHCR and deploy the static demo to
# GitHub Pages from main. Verification also runs on manual dispatch.
# Actions are pinned to full commit SHAs (with the release tag in a comment) so a
# moved tag can never silently swap the code that runs here.
name: CI

'on':
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: no workflow needs write access just to verify.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run unit tests
        run: npm test

      - name: Lint frontend sources
        run: npm run lint

      - name: Typecheck and build frontend
        run: npm run build

      - name: Validate PWA shell
        run: npm run validate:pwa

      - name: Build static demo
        run: npm run build:demo

      - name: Validate static demo artifact
        run: npm run validate:demo

      - name: Check server syntax
        run: node --check server/index.js

      - name: Run server tests
        run: npm test --prefix server

      # Catch Dockerfile/build-context breakage in PRs before merge; publish still
      # does the full smoke-tested buildx build.
      - name: Build Docker image (no push)
        run: docker build --tag migraine-tracker:ci-verify .

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit production server dependencies
        run: npm audit --omit=dev --prefix server

  # The Home Assistant custom integration is Python and lives at the repository
  # root (`custom_components/migraine_tracker`), not under `app`. The `app`
  # `working-directory` default is set per job on `verify`/`pages` only, so this
  # job deliberately sets no default and every command below runs from the
  # checkout root. Verification runs for pushes to `main` and `feature/**`,
  # pull requests to `main`, and manual dispatch, so a feature branch is tested
  # on push without publishing anything; `publish` and `pages` still require
  # refs/heads/main in this repository.
  homeassistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python 3.14: pytest-homeassistant-custom-component==0.13.375 pins
      # homeassistant==2026.10.4, which requires Python >=3.14.2 (the pinned
      # toolchain was verified locally on 3.14.3). The requirements file already
      # pins every package with `==`, so a plain install is the whole setup.
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-homeassistant-dev.txt

      - name: Install pinned Home Assistant test dependencies
        run: python -m pip install -r requirements-homeassistant-dev.txt

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Lint integration and tests
        run: python -m ruff check custom_components/migraine_tracker tests/homeassistant conftest.py

      - name: Check integration and test formatting
        run: python -m ruff format --check custom_components/migraine_tracker tests/homeassistant conftest.py

      - name: Byte-compile integration
        run: python -m compileall -q custom_components/migraine_tracker

      # hassfest is not published to PyPI (and the `homeassistant` wheel does
      # not ship `script.hassfest`), so the only supportable route is the
      # official hassfest container — the same image the home-assistant/actions
      # workflow runs — digest-pinned so it cannot silently change.
      - name: Validate integration JSON
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('custom_components/migraine_tracker/manifest.json','custom_components/migraine_tracker/strings.json','custom_components/migraine_tracker/translations/en.json','hacs.json')]"

      - name: Run hassfest
        run: >-
          docker run --rm -v "$PWD:/github/workspace"
          ghcr.io/home-assistant/hassfest@sha256:da6522993280166fe072704989a2b4c33e639e8ceb69c8ab6ad7ec5045c1a1e3

  # Publishing is deliberately gated: it only runs on a push or manual dispatch
  # whose ref is refs/heads/main in this repository. Verification also runs on
  # feature/** pushes, but those runs skip this job (as do pull requests, which
  # can never reach it). It additionally requires BOTH `verify` and
  # `homeassistant` to pass first, so an image can never be published while the
  # Home Assistant integration job is red. Forks of this repository never
  # publish — their push/dispatch runs skip this job, so they cannot fail trying
  # to push the upstream GHCR namespace.
  publish:
    name: Publish image
    needs: [verify, homeassistant]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'BradyBrenot/migraine-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Publications are serialized AND queued (queue: max) instead of cancelled: a
    # started push is always allowed to finish, and a backlog of pending publishes
    # is never dropped or replaced — each queued run still executes and publishes
    # its own immutable sha tag.
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows main for routine updates; `sha-<full commit>` is the
      # immutable tag used for manual rollback on the NAS.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bradybrenot/migraine-tracker
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Build first and load it locally so the image can be smoke-tested before
      # anything is pushed to the registry.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the just-built image actually serves traffic before it is published:
      # /api/health must report ok, /api/status must return the empty-volume
      # apiVersion-1 document with `Cache-Control: no-store`, one built
      # `/assets/*.js` bundle must serve a non-empty body, and both HTML shells
      # (writer `/` and partner `/view`) must come from the same container.
      # `--pull never` guarantees the just-loaded local image is what gets
      # tested, never a registry copy. No ntfy variables are set, so the
      # container disables notifications and can never send anything. Container
      # and volume are removed even on failure.
      - name: Smoke test image (health + status + assets + web shells)
        env:
          SMOKE_IMAGE: ghcr.io/bradybrenot/migraine-tracker:sha-${{ github.sha }}
          SMOKE_CONTAINER: migraine-tracker-smoke-${{ github.run_id }}
          SMOKE_VOLUME: migraine-tracker-smoke-data-${{ github.run_id }}
          SMOKE_PORT: "18097"
        run: |
          set -euo pipefail

          # Invoked indirectly through the EXIT trap below.
          # shellcheck disable=SC2329
          cleanup() {
            docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$SMOKE_VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker run -d --pull never \
            --name "$SMOKE_CONTAINER" \
            -p "$SMOKE_PORT:3000" \
            -v "$SMOKE_VOLUME:/data" \
            -e DATA_DIR=/data \
            "$SMOKE_IMAGE"

          passed=0
          # Assertions use here-strings rather than `printf ... | grep -q ...`:
          # grep -q exits at the first match, so under `set -o pipefail` the
          # printf side of the pipe can die with SIGPIPE and spuriously fail the
          # step; a here-string avoids the pipe entirely.
          for _ in $(seq 1 30); do
            if health="$(curl -fsS "http://localhost:${SMOKE_PORT}/api/health" 2>/dev/null)" \
              && grep -q '"ok":true' <<<"$health" \
              && shell="$(curl -fsS "http://localhost:${SMOKE_PORT}/" 2>/dev/null)" \
              && grep -q 'Migraine Tracker' <<<"$shell" \
              && grep -q 'id="root"' <<<"$shell" \
              && partner="$(curl -fsS "http://localhost:${SMOKE_PORT}/view" 2>/dev/null)" \
              && grep -q 'Migraine Partner' <<<"$partner" \
              && grep -q 'partner.webmanifest' <<<"$partner"; then
              echo "health: $health"
              echo "shell (/): $shell"
              echo "shell (/view): $partner"
              echo "Smoke test passed: /api/health, /, and /view all responded correctly."
              passed=1
              break
            fi
            sleep 2
          done

          if [ "$passed" -ne 1 ]; then
            docker logs "$SMOKE_CONTAINER" || true
            echo "::error::Smoke test failed: /api/health, /, or /view did not pass within 60s."
            exit 1
          fi

          # One-shot assertions on the warm container, still inside this step so
          # the EXIT trap above removes the container and volume if any of them
          # fail. The container started from an EMPTY tracker volume, so
          # /api/status legitimately answers with the `no_data` document at
          # apiVersion 1 — assert exactly that shape plus the no-store header,
          # never anything health-specific. `curl -D -` writes the headers to
          # stdout ahead of the body, so one variable holds both and the checks
          # stay pipe-free like the loop above.
          if ! status="$(curl -fsS -D - "http://localhost:${SMOKE_PORT}/api/status" 2>/dev/null)"; then
            echo "::error::Smoke test failed: GET /api/status did not return HTTP 200."
            exit 1
          fi
          grep -q '"apiVersion":1' <<<"$status" \
            || { echo "::error::Smoke test failed: /api/status body is not an apiVersion 1 document."; exit 1; }
          grep -qi '^cache-control:[[:space:]]*no-store' <<<"$status" \
            || { echo "::error::Smoke test failed: /api/status is missing a 'Cache-Control: no-store' header."; exit 1; }
          echo "status (/api/status): $status"

          # Cover the static-asset path (@fastify/static over glob) that `verify`
          # only exercises at build time: take one hashed `/assets/*.js` URL out
          # of the writer HTML captured above and prove it serves a non-empty
          # 200. Matches are collected into one variable and the first line is
          # taken with parameter expansion, because piping grep into `head -n1`
          # could SIGPIPE under `set -o pipefail`.
          asset_matches="$(grep -o '/assets/[^"]*\.js' <<<"$shell" || true)"
          asset="${asset_matches%%$'\n'*}"
          if [ -z "$asset" ]; then
            echo "::error::Smoke test failed: no /assets/*.js URL found in the writer HTML."
            exit 1
          fi
          if ! asset_body="$(curl -fsS "http://localhost:${SMOKE_PORT}${asset}" 2>/dev/null)" || [ -z "$asset_body" ]; then
            echo "::error::Smoke test failed: ${asset} did not serve a non-empty 200 body."
            exit 1
          fi
          echo "asset (${asset}): ${#asset_body} bytes"
          echo "Extended smoke checks passed: /api/status (apiVersion 1, no-store) and ${asset} responded correctly."

      # Prevent a stale run from moving `latest` backward: verification of an
      # older commit can finish after a newer merge. Ask GitHub (authenticated
      # with the job token) what the current tip of main is. Only when this
      # run's commit IS the tip do we also push `latest`; otherwise (or if the
      # API call fails — fail closed) push only this run's immutable sha tag.
      # A merge landing between this check and the push is the one unavoidable
      # race; the next run's guard fixes `latest` again.
      - name: Guard latest against superseded commits
        id: latest-guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          image=ghcr.io/bradybrenot/migraine-tracker
          run_sha="${GITHUB_SHA}"

          if tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null)"; then
            if [ "$tip" = "$run_sha" ]; then
              tags="${image}:latest"$'\n'"${image}:sha-${run_sha}"
              echo "Main tip ${tip} matches this run; publishing latest and the immutable sha tag."
            else
              tags="${image}:sha-${run_sha}"
              echo "::notice::Main tip is ${tip} but this run published ${run_sha}; moving latest only for the tip. Publishing the immutable sha tag only."
            fi
          else
            tags="${image}:sha-${run_sha}"
            echo "::notice::Could not determine the current main tip (gh api failed); failing closed and publishing the immutable sha tag only."
          fi

          {
            echo "tags<<LATEST_GUARD_EOF"
            printf '%s\n' "$tags"
            echo "LATEST_GUARD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.latest-guard.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The static demo is a separate artifact (app/dist-demo) deployed to GitHub
  # Pages. It is gated exactly like publish: only a push or manual dispatch of
  # refs/heads/main in this repository — never a pull request, a feature-branch
  # push, or a fork. It runs beside publish (both wait only for verify) and
  # deploys writer-only sample data with no backend and no persistence.
  pages:
    name: Deploy demo to GitHub Pages
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'BradyBrenot/migraine-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize Pages deployments (one environment); never cancel a deployment
    # that already started.
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static demo
        env:
          # Real project base from Pages (normally /migraine-tracker/); keeps the
          # router, assets, and manifest under the same prefix.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:demo

      - name: Validate static demo artifact
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run validate:demo

      # Queued runs can finish verification out of order. Check immediately
      # before publication so an older commit cannot overwrite a newer demo;
      # fail closed if the current main tip cannot be determined.
      - name: Guard demo against superseded commits
        id: demo-guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Main tip is ${tip}; skipping demo deployment for superseded commit ${GITHUB_SHA}."
          fi

      - name: Upload Pages artifact
        if: steps.demo-guard.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: app/dist-demo

      - name: Deploy to GitHub Pages
        if: steps.demo-guard.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
